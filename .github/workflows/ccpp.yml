name: C/C++ CI

env:
  PYTHONPATH: ${{ github.workspace }}/.obj/python-deps

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: apt
      run: sudo apt update && sudo apt install bison flex lua5.3 libconfig-dev pkg-config python3-pip
    - name: Python build dependencies
      run: python3 -m pip install --target .obj/python-deps libconf==2.0.1
    - name: make
      run: make
    - name: Description schema tests
      run: >-
        python3 util/ego/descr/test_schemachecker.py
        util/ego/descr/schemachecker.py
        .obj/util/ego/+i386_descr/i386.descr
        .obj/modules/src/em_data/+em_data_hdr/em_mnem.h
    - name: Description reader tests
      run: >-
        python3 util/ego/descr/test_readers.py
        .obj/staging/lib/ack/ego .obj/staging/share/ack/ego/*.descr
    # minix68k programs linked with the Minix 2.0.4 C library, as on the
    # rosco_m68k board (plat/minix68k/tests/minix204.sh). The library comes
    # from the minix-st-2.0.4 repository at a pinned commit; move the pin
    # deliberately.
    - name: fetch minix-st-2.0.4
      env:
        MINIX204_REPO: https://github.com/maarten-boot/minix-st-2.0.4.git
        MINIX204_SHA: c17cc1a101cc015db99a44f94712c0379a809d2b
      run: |
        git init -q "$RUNNER_TEMP/minix-st-2.0.4"
        cd "$RUNNER_TEMP/minix-st-2.0.4"
        git fetch -q --depth 1 "$MINIX204_REPO" "$MINIX204_SHA"
        git checkout -q FETCH_HEAD
    - name: make minix204-test
      run: make minix204-test "MINIX204=$RUNNER_TEMP/minix-st-2.0.4"

  # The host tools built with AddressSanitizer and UndefinedBehaviorSanitizer,
  # and all tests run with them: any finding fails the build. Leaks are not
  # checked (the compiler passes never free).
  build-linux-sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
      SAN: gcc -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: apt
      run: sudo apt update && sudo apt install bison flex lua5.3 libconfig-dev pkg-config python3-pip
    - name: Python build dependencies
      run: python3 -m pip install --target .obj/python-deps libconf==2.0.1
    - name: make with sanitizers
      run: make "CC=$SAN" "HOSTCC=$SAN"

  # The host tools built with clang, whose optimiser exploits undefined
  # behaviour differently from gcc's, and all tests run with them.
  build-linux-clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: apt
      run: sudo apt update && sudo apt install bison flex lua5.3 libconfig-dev pkg-config python3-pip clang
    - name: Python build dependencies
      run: python3 -m pip install --target .obj/python-deps libconf==2.0.1
    - name: make with clang
      run: make CC=clang HOSTCC=clang
